spring.application.name=package-worker

# Headless Worker (kein Webserver)
spring.main.web-application-type=none
server.port=8085
# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Queue-Name muss zu postal-rest passen!
app.queues.pack=postal.package
app.queues.letter=postal.letter
# Postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/postal
spring.datasource.username=postal
spring.datasource.password=postal
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false



spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=15000
spring.datasource.hikari.connection-timeout=10000